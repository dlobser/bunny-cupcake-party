<title>Sarah's Cupcake Party</title>
<!-- The online (claude.ai Artifact) version of index.html. Same game files in js/;
     the host adds the doctype, head and viewport, so this file has none of its own. -->
<style>
  /* One full-screen game canvas; the game draws every colour itself. */
  :root { --ground: #7fb956; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--ground);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; outline: none; }
</style>
<canvas id="game" tabindex="0"></canvas>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/nav.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
